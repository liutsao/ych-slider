<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel YCH Carousel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
    }
    .carousel {
      position: relative;
      width: 100%;
      height: 100%;
      padding-bottom: 28px;
      overflow: hidden;
    }
    .slides-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s ease-in-out;
    }
    .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-in;
      padding: 0 36px; /* 預留左右箭頭空間避免擋到圖 */
    }
    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      border-radius: 8px;
    }
    /* 左右箭頭 */
    .nav-btn {
      position: absolute;
      top: calc(50% - 14px);
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      z-index: 10;
      transition: color 0.2s;
    }
    .nav-btn:hover { color: #333; }
    .prev-btn { left: 4px; }
    .next-btn { right: 4px; }
    
    /* 底部小圓點 */
    .pagination {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.2s, background 0.2s;
    }
    .dot.active {
      background: #333;
      opacity: 1;
    }

    /* 點擊燈箱放大預覽 */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      padding: 20px;
    }
    #lightbox img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      image-rendering: pixelated;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="carousel">
    <div class="slides-wrapper" id="gallery"></div>
    <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
    <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    <div class="pagination" id="pagination"></div>
  </div>

  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Preview">
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const imgsParam = params.get('imgs');
    const gallery = document.getElementById('gallery');
    const pagination = document.getElementById('pagination');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    if (imgsParam) {
      const urls = imgsParam.split(',').map(u => u.trim()).filter(Boolean);
      let currentIndex = 0;

      urls.forEach((url, index) => {
        // 建立圖片投影片
        const slide = document.createElement('div');
        slide.className = 'slide';
        const img = document.createElement('img');
        img.src = url;
        img.onclick = () => {
          document.getElementById('lightbox-img').src = url;
          document.getElementById('lightbox').style.display = 'flex';
        };
        slide.appendChild(img);
        gallery.appendChild(slide);

        // 建立底部小圓點
        const dot = document.createElement('div');
        dot.className = index === 0 ? 'dot active' : 'dot';
        dot.onclick = () => goToSlide(index);
        pagination.appendChild(dot);
      });

      const dots = document.querySelectorAll('.dot');

      function goToSlide(index) {
        currentIndex = (index + urls.length) % urls.length;
        gallery.style.transform = `translateX(-${currentIndex * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
      }

      prevBtn.onclick = () => goToSlide(currentIndex - 1);
      nextBtn.onclick = () => goToSlide(currentIndex + 1);

      // 若只有一張圖，隱藏箭頭與圓點
      if (urls.length <= 1) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        pagination.style.display = 'none';
      }
    } else {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      gallery.innerHTML = '<div style="margin:auto;color:#888;font-size:14px;">請在網址後方加上 ?imgs=圖片1,圖片2</div>';
    }
  </script>
</body>
</html>
