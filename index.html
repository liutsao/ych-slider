<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel YCH Carousel</title>
  <link rel="stylesheet" href="https://jsdelivr.net" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
    }
    .swiper {
      width: 100%;
      height: 100%;
      padding-bottom: 28px; /* 預留給下方小圓點的空間 */
    }
    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-in;
    }
    .swiper-slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain; /* 確保圖片完整呈現、絕對不裁切 */
      image-rendering: pixelated; /* 保持像素邊緣銳利不模糊 */
      border-radius: 8px;
    }
    /* 左右箭頭與小圓點樣式 */
    .swiper-button-next, .swiper-button-prev {
      color: #888;
      transform: scale(0.65);
    }
    .swiper-button-next:hover, .swiper-button-prev:hover { color: #333; }
    .swiper-pagination-bullet { background: #999; opacity: 0.5; }
    .swiper-pagination-bullet-active { background: #333; opacity: 1; }
    
    /* 點擊燈箱放大預覽 */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      padding: 20px;
    }
    #lightbox img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      image-rendering: pixelated;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="swiper">
    <div class="swiper-wrapper" id="gallery"></div>
    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>

  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Preview">
  </div>

  <script src="https://jsdelivr.net"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const imgsParam = params.get('imgs');
    const gallery = document.getElementById('gallery');

    if (imgsParam) {
      const urls = imgsParam.split(',').map(u => u.trim()).filter(Boolean);
      urls.forEach(url => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        const img = document.createElement('img');
        img.src = url;
        img.onclick = () => {
          document.getElementById('lightbox-img').src = url;
          document.getElementById('lightbox').style.display = 'flex';
        };
        slide.appendChild(img);
        gallery.appendChild(slide);
      });

      new Swiper('.swiper', {
        loop: urls.length > 1,
        pagination: { el: '.swiper-pagination', clickable: true },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    } else {
      gallery.innerHTML = '<div style="margin:auto;color:#888;font-size:14px;">請在網址後方加上 ?imgs=圖片1,圖片2</div>';
    }
  </script>
</body>
</html>
