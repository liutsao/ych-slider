<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel YCH Carousel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
    }
    .carousel {
      position: relative;
      width: 100%;
      height: 100%;
      padding-bottom: 28px;
      overflow: hidden;
    }
    .slides-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s ease-in-out;
    }
    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 36px;
    }
    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      border-radius: 8px;
    }
    .nav-btn {
      position: absolute;
      top: calc(50% - 14px);
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      z-index: 10;
      transition: color 0.2s;
    }
    .nav-btn:hover { color: #333; }
    .prev-btn { left: 4px; }
    .next-btn { right: 4px; }
    
    .pagination {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.2s, background 0.2s;
    }
    .dot.active {
      background: #333;
      opacity: 1;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #202020; }
      .nav-btn { color: #aaa; }
      .nav-btn:hover { color: #fff; }
      .dot { background: #777; }
      .dot.active { background: #fff; }
    }
  </style>
</head>
<body>

  <div class="carousel">
    <div class="slides-wrapper" id="gallery"></div>
    <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
    <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const imgsParam = params.get('imgs');
    const gallery = document.getElementById('gallery');
    const pagination = document.getElementById('pagination');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    if (imgsParam) {
      const urls = imgsParam.split(',').map(u => u.trim()).filter(Boolean);
      let currentIndex = 0;

      urls.forEach((url, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        
        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer';
        img.src = url;
        
        img.onerror = () => {
          slide.innerHTML = `<div style="color:#d9534f;font-size:12px;text-align:center;">圖片載入失敗：<br>${url}</div>`;
        };
        
        slide.appendChild(img);
        gallery.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = index === 0 ? 'dot active' : 'dot';
        dot.onclick = () => goToSlide(index);
        pagination.appendChild(dot);
      });

      const dots = document.querySelectorAll('.dot');

      function goToSlide(index) {
        currentIndex = (index + urls.length) % urls.length;
        gallery.style.transform = `translateX(-${currentIndex * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
      }

      prevBtn.onclick = () => goToSlide(currentIndex - 1);
      nextBtn.onclick = () => goToSlide(currentIndex + 1);

      if (urls.length <= 1) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        pagination.style.display = 'none';
      }
    } else {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      gallery.innerHTML = '<div style="margin:auto;color:#888;font-size:14px;">未偵測到圖片參數，請確認網址包含 ?imgs=...</div>';
    }
  </script>
</body>
</html>
